<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Signing out…</title>
</head>
<body>
    <noscript>
        <p><a href="{{ next_url }}">Continue</a></p>
    </noscript>
    <script>
        (function () {
            function clearAuthStorage(store) {
                if (!store) return;
                var keys = [];
                for (var i = 0; i < store.length; i++) {
                    var key = store.key(i);
                    if (!key) continue;
                    if (key.indexOf("firebase") === 0 || key === "g_state") {
                        keys.push(key);
                    }
                }
                for (var j = 0; j < keys.length; j++) {
                    store.removeItem(keys[j]);
                }
            }

            try {
                clearAuthStorage(window.sessionStorage);
            } catch (e) {}
            try {
                clearAuthStorage(window.localStorage);
            } catch (e) {}

            // GSI records signed-in status in g_state. Expire it so the next
            // Google button click does not reuse a stale auto-select session.
            document.cookie = "g_state=;path=/;max-age=0";

            window.location.replace({{ next_url | tojson }});
        })();
    </script>
</body>
</html>

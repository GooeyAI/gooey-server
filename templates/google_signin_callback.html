{% extends 'base.html' %}

{% block title %}Signing in…{% endblock title %}

{% block content %}
    <div data-replace-login-spinner style="text-align: center; padding: 2rem">
        <h5>Signing in...</h5>
    </div>
    <script>
        (async function () {
            await window.waitUntilHydrated;
            if (typeof handleCredentialResponse !== "function") return;
            handleCredentialResponse({ credential: {{ credential | tojson }} });
        })();
    </script>
{% endblock %}
